<div class="admin-page">
  <div class="page-header">
    <h1>Manage Appointments</h1>
    <p>{{ appointments().length }} total</p>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>Service</th>
          <th>Date</th>
          <th>Time</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (a of appointments(); track a.id) {
          <tr>
            <td>{{ a.name }}</td>
            <td>{{ a.phone }}</td>
            <td>{{ a.service_name || '—' }}</td>
            <td>{{ a.preferred_date }}</td>
            <td>{{ a.preferred_time }}</td>
            <td>
              <select [value]="a.status" (change)="updateStatus(a.id, $any($event.target).value)">
                @for (s of statuses; track s) {
                  <option [value]="s">{{ s }}</option>
                }
              </select>
            </td>
            <td>
              <button mat-icon-button color="warn" (click)="deleteAppointment(a.id)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
