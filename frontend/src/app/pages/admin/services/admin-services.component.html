<div class="admin-page">
  <div class="page-header">
    <h1>Manage Services</h1>
    <p>{{ services().length }} services</p>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Image</th>
          <th>Name</th>
          <th>Price</th>
          <th>Duration</th>
          <th>Featured</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (s of services(); track s.id) {
          <tr>
            <td><img [src]="api.resolveImageUrl(s.image_url)" [alt]="s.name" /></td>
            <td>{{ s.name }}</td>
            <td>{{ s.price | currencyInr }}</td>
            <td>{{ s.duration_minutes }} min</td>
            <td>{{ s.is_featured ? 'Yes' : 'No' }}</td>
            <td>
              <button mat-icon-button color="warn" (click)="deleteService(s.id)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
