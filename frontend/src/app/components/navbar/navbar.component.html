<header class="navbar" [class.scrolled]="scrolled()" [class.menu-open]="menuOpen()">
  <div class="container">
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <span class="logo-icon">
        <img src="assets/images/logo.png" alt="" />
      </span>
      <span class="logo-text">
        <span class="brand-name">
          <span class="brand-hindi">नख</span><span class="brand-latin">Raah</span>
        </span>
        <span class="brand-tagline">Nail Studio</span>
      </span>
    </a>

    <nav class="nav-links">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          (click)="closeMenu()"
        >{{ link.label }}</a>
      }
    </nav>

    <div class="actions">
      <button class="theme-toggle" (click)="theme.toggle()" aria-label="Toggle dark mode">
        <mat-icon>{{ theme.isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <a routerLink="/contact" class="book-btn" (click)="closeMenu()">Book Now</a>
      <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle menu">
        <mat-icon>{{ menuOpen() ? 'close' : 'menu' }}</mat-icon>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <div class="mobile-menu">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          (click)="closeMenu()"
        >{{ link.label }}</a>
      }
      <a routerLink="/contact" class="mobile-book" (click)="closeMenu()">Book Appointment</a>
    </div>
  }
</header>
